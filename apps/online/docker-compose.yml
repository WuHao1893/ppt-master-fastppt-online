services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fastppt_online
      POSTGRES_USER: fastppt
      POSTGRES_PASSWORD: fastppt_dev_only
    ports:
      - "5432:5432"
    volumes:
      - fastppt-postgres:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - fastppt-redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fastppt
      MINIO_ROOT_PASSWORD: fastppt_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - fastppt-minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 fastppt fastppt_dev_only && mc mb --ignore-existing local/fastppt-online

volumes:
  fastppt-postgres:
  fastppt-redis:
  fastppt-minio:
